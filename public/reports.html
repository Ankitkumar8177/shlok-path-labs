<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Report — Shlok Path Labs & Digital X-Ray, Lucknow</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="page-hero">
  <h2 data-i18n="rep_title"></h2>
  <p data-i18n="rep_sub"></p>
</div>

<section>
  <div class="container">
    <div class="form-card">
      <form id="repForm">
        <label data-i18n="f_phone"></label>
        <input type="tel" id="phone" required pattern="[0-9]{10}" maxlength="10" placeholder="10 digit mobile">
        <label data-i18n="f_code"></label>
        <input type="text" id="code" required maxlength="10" placeholder="e.g. A3F9B2" style="text-transform:uppercase">
        <button type="submit" class="btn btn-green" style="width:100%;margin-top:18px" data-i18n="rep_find"></button>
      </form>
      <div class="msg" id="msg"></div>
      <div id="results" style="margin-top:14px"></div>
    </div>
  </div>
</section>

<script src="/js/main.js"></script>
<script>
initPage('rep');
document.getElementById('repForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const msg = document.getElementById('msg');
  const results = document.getElementById('results');
  msg.className = 'msg'; results.innerHTML = '';
  const phone = document.getElementById('phone').value.trim();
  const code = document.getElementById('code').value.trim().toUpperCase();
  try {
    const r = await fetch('/api/report-find', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, code }) });
    const j = await r.json();
    if (!j.reports || !j.reports.length) {
      msg.className = 'msg err'; msg.textContent = t('rep_none'); return;
    }
    msg.className = 'msg ok';
    msg.textContent = getLang()==='hi' ? `✅ ${j.reports.length} रिपोर्ट मिली:` : `✅ Found ${j.reports.length} report(s):`;
    j.reports.forEach(rep => {
      results.insertAdjacentHTML('beforeend', `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fafffd;border:1.5px solid #cfd8d3;border-radius:9px;padding:12px;margin-top:8px">
          <div><b>${rep.patient_name}</b><br><small style="color:var(--gray)">${rep.original_name} • ${rep.created_at}</small></div>
          <a class="btn btn-green" style="padding:9px 16px;font-size:14px;white-space:nowrap"
             href="/api/report-download/${rep.id}?phone=${encodeURIComponent(phone)}&code=${encodeURIComponent(code)}" data-i18n="rep_dl">${t('rep_dl')}</a>
        </div>`);
    });
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = getLang()==='hi' ? 'कुछ गलत हुआ — दोबारा कोशिश करें।' : 'Something went wrong — please try again.';
  }
});
</script>
</body>
</html>
