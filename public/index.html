<script>
// Set the live "years of trust" value before animations start
(function(){ var y = document.getElementById('yrs'); var n = new Date().getFullYear() - 2021; y.dataset.count = n; y.textContent = n + '+'; })();
initPage('home');
// Load photos uploaded from the admin panel (hero, doctors, gallery)
(async function(){
  try {
    const p = await (await fetch('/api/photos')).json();
    const v = '?v=' + Date.now();
    function setImg(elId, src) {
      if (!src) return;
      const el = document.getElementById(elId);
      const img = new Image();
      img.onload = () => { el.innerHTML = ''; el.appendChild(img); };
      img.src = src + v;
    }
    // If the client uploaded their own lab front photo, use it as the hero background
    if (p.hero) document.getElementById('heroBg').style.backgroundImage = "url('" + p.hero + v + "')";
    setImg('doc1Img', p.doctor1);
    setImg('doc2Img', p.doctor2);
    if (p.gallery && p.gallery.length) {
      document.getElementById('gallerySec').style.display = '';
      document.getElementById('galleryGrid').innerHTML = p.gallery.map(g =>
        `<figure class="gallery-item"><img src="${g.src}" loading="lazy" alt="${(g.caption || 'Shlok Path Labs').replace(/"/g, '&quot;')}">${g.caption ? `<figcaption>${g.caption.replace(/</g, '&lt;')}</figcaption>` : ''}</figure>`
      ).join('');
    }
  } catch (e) {}
})();
</script>
