<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Test Online — Shlok Path Labs & Digital X-Ray, Lucknow</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="page-hero">
  <h2 data-i18n="book_title"></h2>
  <p data-i18n="book_sub"></p>
</div>

<section>
  <div class="container">
    <div class="form-card">
      <form id="bookForm">
        <label data-i18n="f_name"></label>
        <input type="text" id="name" required maxlength="100">
        <label data-i18n="f_phone"></label>
        <input type="tel" id="phone" required pattern="[0-9]{10}" maxlength="10" placeholder="10 digit mobile">
        <label data-i18n="f_tests"></label>
        <div class="test-picker" id="testPicker"></div>
        <label data-i18n="f_date"></label>
        <input type="date" id="date" required>
        <label data-i18n="f_notes"></label>
        <textarea id="notes" maxlength="500"></textarea>
        <button type="submit" class="btn btn-green" style="width:100%;margin-top:18px" data-i18n="submit_book"></button>
      </form>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</section>

<script src="/js/main.js"></script>
<script>
initPage('book');
loadTestPicker('testPicker');
document.getElementById('date').min = new Date().toISOString().split('T')[0];

document.getElementById('bookForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  const tests = pickedTests('testPicker');
  if (!tests) { msg.className = 'msg err'; msg.textContent = getLang()==='hi' ? 'कम से कम एक टेस्ट चुनें।' : 'Please select at least one test.'; return; }
  const body = {
    name: document.getElementById('name').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    tests: tests,
    date: document.getElementById('date').value,
    notes: document.getElementById('notes').value.trim()
  };
  try {
    const r = await fetch('/api/book', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error();
    const hi = getLang() === 'hi';
    let html = hi
      ? `✅ <b>बुकिंग हो गई!</b> Booking ID: <b>#${j.id}</b><br>हम जल्द ही कॉल/WhatsApp पर कन्फर्म करेंगे।`
      : `✅ <b>Booking received!</b> Booking ID: <b>#${j.id}</b><br>We will confirm on call/WhatsApp shortly.`;
    if (j.upi_id) {
      html += hi
        ? `<br><br>💳 <b>UPI से भुगतान:</b> <code>${j.upi_id}</code><br><a class="btn btn-green" style="margin-top:8px" href="upi://pay?pa=${encodeURIComponent(j.upi_id)}&pn=Shlok%20Path%20Labs">UPI App खोलें</a>`
        : `<br><br>💳 <b>Pay via UPI:</b> <code>${j.upi_id}</code><br><a class="btn btn-green" style="margin-top:8px" href="upi://pay?pa=${encodeURIComponent(j.upi_id)}&pn=Shlok%20Path%20Labs">Open UPI App</a>`;
    }
    const waMsg = `Hello! I have booked a test online.\nBooking ID: #${j.id}\nName: ${body.name}\nTests: ${body.tests}\nDate: ${body.date}`;
    const waLabel = hi ? '💬 WhatsApp पर कन्फर्म करें' : '💬 Confirm on WhatsApp';
    html += `<br><a class="btn" style="background:#25d366;color:#fff;margin-top:10px" target="_blank" href="https://wa.me/${j.whatsapp}?text=${encodeURIComponent(waMsg)}">${waLabel}</a>`;
    msg.className = 'msg ok'; msg.innerHTML = html;
    this.reset();
    document.getElementById('date').min = new Date().toISOString().split('T')[0];
    msg.scrollIntoView({ behavior: 'smooth' });
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = getLang()==='hi' ? 'कुछ गलत हुआ — दोबारा कोशिश करें या कॉल करें: 7905010042' : 'Something went wrong — try again or call 7905010042';
  }
});
</script>
</body>
</html>
