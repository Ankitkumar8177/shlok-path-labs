<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Shlok Path Labs</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0b6e4f, #14a37f); }
  .login-box { background: #fff; border-radius: 14px; padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .login-box h2 { color: var(--green); text-align: center; margin-bottom: 4px; }
  .login-box p { text-align: center; color: var(--gray); font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="login-box">
    <h2>🔐 Admin Panel</h2>
    <p>Shlok Path Labs &amp; Digital X-Ray</p>
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" required autocomplete="username">
      <label>Password</label>
      <input type="text" id="password" required autocomplete="current-password" style="-webkit-text-security:disc">
      <button type="submit" class="btn btn-green" style="width:100%;margin-top:18px">Login</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  const r = await fetch('/admin/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
  });
  if (r.ok) { location.href = '/admin/dashboard'; }
  else {
    const j = await r.json().catch(() => ({}));
    msg.className = 'msg err'; msg.textContent = j.error || 'Login failed';
  }
});
</script>
</body>
</html>
